<!doctype html>
<html lang="pt-BR">
<head>

<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>

  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#fff;color:#1D1D1B;font:400 1rem/1.6 "Jost",system-ui,sans-serif;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,3fr)}

  a.acao:hover{text-decoration:underline}
  .en{font-size:1rem;color:#5F5F5B;margin-top:40px}
  .en a{color:inherit}
  :focus-visible{outline:2px solid #1D1D1B;outline-offset:2px}
  @media (max-width:767.98px){body{grid-template-columns:1fr}.lado{border-right:0;border-bottom:1px solid #E4E4E0;padding:24px 16px}.lado img{max-width:140px}main{padding:56px 16px}}

</head>
<body>

  <main>

    <a class="acao" href="/">Ir para a página inicial</a>
    <p lang="en" class="en">Page not found. <a href="/en/">Go to the English homepage</a>.</p>
  </main>
</body>
</html>
