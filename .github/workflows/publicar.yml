# Publica o site no GitHub Pages.
#
# Roda sozinho quando:
#   - alguém salva uma alteração (pelo Pages CMS ou direto no GitHub);
#   - de hora em hora, para trazer os eventos novos do Google Agenda e tirar os que já passaram.
# Também pode ser disparado à mão: pelo botão "Atualizar o site agora" do Pages CMS
# ou em Actions → Publicar site → Run workflow.
#
# Para funcionar, em Settings → Pages, o campo "Source" deve estar em "GitHub Actions".

name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # de hora em hora, aos 17 minutos
  workflow_dispatch:
    inputs:
      payload:
        description: "Dados enviados pelo botão do Pages CMS (para rodar à mão, deixe como está)"
        required: true
        type: string
        default: "{}"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos do repositório
        uses: actions/checkout@v5

      - name: Preparar o Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar o leitor de agenda (ical.js)
        run: npm ci --no-audit --no-fund

      - name: Gerar as páginas (português e inglês)
        run: node scripts/gerar.mjs

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar o site gerado
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v4
